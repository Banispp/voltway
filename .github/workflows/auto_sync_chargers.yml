name: ⚡ Auto-Sync EV Chargers Database

on:
  schedule:
    # Runs automatically twice every day at 00:00 and 12:00 UTC
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Deep Scan for Ather, VIDA & Bolt.Earth (384 National Zoom 18 Cells)
        run: python scripts/sync_all_networks.py

      - name: Commit and Push Updated Charger Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "VoltWay Auto-Sync Bot"
          git add ather_grid_chargers.json bolt_chargers.json vida_chargers.json chargers_db.json chargers_db.js
          if git diff --staged --quiet; then
            echo "No new chargers detected today. Database is already up to date!"
          else
            git commit -m "Auto-Sync: Added newly detected Ather, VIDA & Bolt chargers [skip ci]"
            git push
          fi
