name: Build VoltWay Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."
          app-name: "VoltWay2W"
          output-folder-path: "release-apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltWay2W-APK
          path: release-apk/
