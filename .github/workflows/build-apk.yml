name: Build VoltWay Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Package Web Assets and Build APK with Capacitor
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js chargers_db.js chargers_db.json css js icons www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation
          npx cap add android
          npx cap sync android
          python scripts/inject_permissions.py
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltWay-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Clean up Old GitHub Releases and Tags
        if: github.ref == 'refs/heads/master'
        run: |
          echo "Listing and removing any previous releases..."
          gh release list --limit 100 --json tagName,databaseId --jq '.[] | "\(.databaseId) \(.tagName)"' | while read -r id tag; do
            if [ -n "$id" ] && [ "$tag" != "v5.41-release" ]; then
              echo "Deleting old release: $tag (id: $id)"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v5.41-release
          name: "VoltWay 2W Android APK v5.41 (Dual-Color Round Trip Lines & Seamless Stop Removal)"
          body: "VoltWay 2W v5.41: 1) Distinct Outward vs Return Route Colors: Outward journey is rendered in Electric Cyan / Emerald Green, while Return journey is rendered in Vibrant Sunset Orange with high-visibility dashes, plus a dedicated Turnaround Point pin, so both tracks are clearly distinguishable on the same highway; 2) Seamless Stop Removal: Fixed route cut-off bug when removing stops by clearing stale distance caches and auto-reconnecting through to the destination."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
