name: Build VoltWay Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Package Web Assets and Build APK with Capacitor
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js chargers_db.js chargers_db.json css js icons www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation
          npx cap add android
          npx cap sync android
          python scripts/inject_permissions.py
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltWay-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v5.10-release
          name: "VoltWay 2W Android APK v5.10 (4,445 Two-Wheeler Fast Chargers, 611 Hero VIDA Restored, Fast Only Default & Zero Truncation)"
          body: "VoltWay 2W v5.10: Restored all 611 Hero VIDA Fast chargers across India (total 4,445 2W DC Fast chargers nationwide: 3,572 Ather Grid, 611 VIDA Grid, 262 Bolt Fast); default to ⚡ Fast Only and 🌐 All states without clipping; removed viewport 60-cap truncation; instant switching between All, Kerala, Karnataka, and Tamil Nadu."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
