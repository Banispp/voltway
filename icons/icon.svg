<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#141e30"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00E676" stroke-width="4" opacity="0.3"/>
  <g filter="url(#glow)">
    <polygon points="280,50 130,270 240,270 200,430 380,220 265,220" fill="url(#boltGrad)"/>
    <polygon points="275,80 160,260 235,260 205,390 345,230 260,230" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- 2-Wheeler base -->
  <circle cx="170" cy="450" r="28" fill="#141e30" stroke="#00B0FF" stroke-width="8"/>
  <circle cx="342" cy="450" r="28" fill="#141e30" stroke="#00B0FF" stroke-width="8"/>
  <line x1="170" y1="450" x2="342" y2="450" stroke="#00B0FF" stroke-width="8" stroke-linecap="round"/>
</svg>